services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: contractflow
      POSTGRES_USER: contractflow
      POSTGRES_PASSWORD: contractflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: contractflow
      MINIO_ROOT_PASSWORD: contractflow-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
volumes:
  postgres_data:
  redis_data:
  minio_data:
